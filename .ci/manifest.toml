[package]
name = "anemoi-utils"
repo = "ecmwf/anemoi-utils"
visibility = "public"
# Approved fork pull requests run ci.yml through the generated ci-fork.yml.
fork-pull-requests = true
compiler-inputs = []

# Each leg publishes its wheel, so a consumer's leg takes the one tested on
# its own Python (python-version-input).
[matrix.test]
triggers = ["upstream-change", "rebuild-request"]

[matrix.test.defaults]
job-script = "./.ci/test.sh.j2"
runs-on = "ubuntu-24.04"
platform = "gh-ubuntu-24.04"
extras = "all,tests"

[[matrix.test.include]]
python-version = "3.11"

[[matrix.test.include]]
python-version = "3.12"
# Only this leg measures coverage: one upload per commit, and the other legs stay fast.
pytest-args = "--cov --cov-report=xml --cov-report=markdown:coverage.md --cov-report=term"

[[matrix.test.include]]
python-version = "3.13"

[[trigger-downstream]]
repo = "ecmwf/anemoi-transform"
ref = "main"

[[trigger-downstream]]
repo = "ecmwf/anemoi-datasets"
ref = "main"

[[trigger-downstream]]
repo = "ecmwf/anemoi-core"
ref = "main"

[[trigger-downstream]]
repo = "ecmwf/anemoi-inference"
ref = "main"

[[trigger-downstream]]
repo = "ecmwf/anemoi-plugins"
ref = "main"

[downstream]
run-default = "all"
